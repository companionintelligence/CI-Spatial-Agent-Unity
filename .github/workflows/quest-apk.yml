# Builds the Meta Quest 3 APK through the project's own build entry point
# (XRScan.EditorTools.XRScanBuilder.BuildQuest, the same code as the
# XRScan > Build > Quest 3 menu) in the Unity editor version named in
# ProjectSettings/ProjectVersion.txt, then checks what was packaged.
# Called by ci.yml after the tests pass; can also be started by hand from the
# Actions tab. See docs/CI.md.
#
# No workflow-level concurrency here on purpose: when called, this workflow would
# share the caller's concurrency group and block itself. ci.yml sets it instead.
name: Quest APK

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        description: Contents of a Unity Personal licence file (Unity_lic.ulf). Leave unset when UNITY_SERIAL is used.
        required: false
      UNITY_SERIAL:
        description: Unity Plus/Pro serial key. Leave unset when UNITY_LICENSE is used.
        required: false
      UNITY_EMAIL:
        description: E-mail address of the Unity ID that owns the licence.
        required: false
      UNITY_PASSWORD:
        description: Password of the Unity ID that owns the licence.
        required: false
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      unity-version: ${{ steps.unity.outputs.version }}
      licence-ok: ${{ steps.licence.outputs.available }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Unity version from ProjectSettings/ProjectVersion.txt
        id: unity
        run: |
          version="$(sed -n 's/^m_EditorVersion:[[:space:]]*//p' ProjectSettings/ProjectVersion.txt | tr -d '\r' | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]; then
            echo "::error file=ProjectSettings/ProjectVersion.txt::Could not read m_EditorVersion (got '${version}')."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Unity editor \`${version}\` (from ProjectSettings/ProjectVersion.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Unity licence secrets
        id: licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Fork and Dependabot pull requests never receive repository secrets.
          NO_SECRETS_EXPECTED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
        run: |
          missing=()
          [[ -n "$UNITY_EMAIL" ]] || missing+=("UNITY_EMAIL")
          [[ -n "$UNITY_PASSWORD" ]] || missing+=("UNITY_PASSWORD")
          [[ -n "$UNITY_LICENSE" || -n "$UNITY_SERIAL" ]] || missing+=("UNITY_LICENSE or UNITY_SERIAL")
          if (( ${#missing[@]} == 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$NO_SECRETS_EXPECTED" == "true" ]]; then
            echo "::notice title=Unity jobs skipped::Secrets are not passed to fork or Dependabot pull requests, so the Unity jobs are skipped. A maintainer can run the workflow from a branch of this repository."
            exit 0
          fi
          list="$(printf '%s; ' "${missing[@]}")"
          echo "::error title=Unity licence secrets missing::Add these repository secrets: ${list%; }. See docs/CI.md."
          exit 1

  build:
    name: Build Quest APK
    needs: setup
    if: needs.setup.outputs.licence-ok == 'true'
    runs-on: ubuntu-24.04
    # A cold run (no Library cache) imports the whole project, then compiles IL2CPP.
    timeout-minutes: 150
    env:
      UNITY_VERSION: ${{ needs.setup.outputs.unity-version }}
      # Output path hard-coded in XRScanBuilder (Builds/ is git-ignored).
      APK: Builds/CISpatialCompanion-Quest.apk
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Unity editor image
        # The Android editor image is over 8 GB compressed; drop preinstalled SDKs this job never uses
        # (the image brings its own Android SDK, NDK and JDK).
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Restore the Library cache
        id: library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ runner.os }}-android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-android-${{ env.UNITY_VERSION }}-

      - name: Build with XRScanBuilder.BuildQuest
        id: build
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: XRScan.EditorTools.XRScanBuilder.BuildQuest
          # XRScanBuilder sets its own player settings and output path; skip game-ci's
          # git-based versioning (it would need full history and a clean tree).
          versioning: None

      - name: Save the Library cache
        if: steps.build.outcome == 'success' && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      - name: Verify the APK
        # XRScanBuilder logs a failed build without making the editor exit non-zero, so the
        # APK itself is the source of truth. The expectations mirror docs/BUILD.md.
        run: |
          if [[ ! -s "$APK" ]]; then
            echo "::error title=Quest APK missing::${APK} was not produced. Search the build log above for '[XRScanBuilder]'."
            exit 1
          fi
          errors=()

          # Native libraries: ARM64 only, and none of the PICO / MockHMD libraries that
          # XRScanNativeLibExcluder strips from Quest builds.
          mapfile -t libs < <(unzip -Z1 "$APK" | grep '^lib/' || true)
          has_lib() {
            local lib
            for lib in "${libs[@]}"; do
              if [[ "$lib" == "$1" ]]; then return 0; fi
            done
            return 1
          }
          for lib in "${libs[@]}"; do
            [[ "$lib" == lib/arm64-v8a/* ]] || errors+=("Non-ARM64 native library packaged: ${lib}")
          done
          for name in libil2cpp.so libunity.so libopenxr_loader.so; do
            has_lib "lib/arm64-v8a/${name}" || errors+=("Missing native library lib/arm64-v8a/${name}")
          done
          for name in libPICO_TOBAPI.so libpvrcapturelib.so libpxrplatformloader.so libCameraRenderingPlugin.so libopenxr_pico.so libUnityMockHMD.so; do
            if has_lib "lib/arm64-v8a/${name}"; then errors+=("PICO/MockHMD library packaged in the Quest APK: ${name}"); fi
          done

          # Manifest: dump it with aapt2 from the Unity Android image the build just used.
          cat > "$RUNNER_TEMP/aapt2-dump.sh" <<'SH'
          aapt2="$(find /opt -type f -name aapt2 -path '*build-tools*' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$aapt2" ]; then
            aapt2="$(find / -xdev -type f -name aapt2 -path '*build-tools*' 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$aapt2" ]; then echo "aapt2 not found in the Unity image" >&2; exit 1; fi
          "$aapt2" dump badging "$1" || true
          "$aapt2" dump permissions "$1" || true
          SH
          image=""
          while read -r ref; do
            if [[ "$ref" == "unityci/editor:ubuntu-${UNITY_VERSION}-android-"* ]]; then image="$ref"; break; fi
          done < <(docker image ls --format '{{.Repository}}:{{.Tag}}')
          manifest=""
          if [[ -z "$image" ]]; then
            errors+=("No unityci/editor Android image for ${UNITY_VERSION} found locally to run aapt2")
          elif ! manifest="$(docker run --rm --entrypoint /bin/bash \
              -v "$RUNNER_TEMP/aapt2-dump.sh:/aapt2-dump.sh:ro" -v "$PWD/Builds:/apk:ro" \
              "$image" /aapt2-dump.sh "/apk/$(basename "$APK")")"; then
            errors+=("aapt2 could not read the APK manifest")
          fi
          if [[ -n "$manifest" ]]; then
            expect() { grep -Eq -- "$1" <<< "$manifest" || errors+=("$2"); }
            reject() { if grep -Eq -- "$1" <<< "$manifest"; then errors+=("$2"); fi; }
            expect "^package: name='com\.companionintelligence\.xrscan'" "Package name is not com.companionintelligence.xrscan"
            expect "^(minSdkVersion|sdkVersion):'32'$" "Minimum SDK is not API 32"
            expect "^native-code: 'arm64-v8a'$" "native-code is not exactly arm64-v8a"
            expect "name='android\.permission\.RECORD_AUDIO'" "Missing android.permission.RECORD_AUDIO (added by XRScanManifestPostProcessor)"
            expect "name='horizonos\.permission\.HEADSET_CAMERA'" "Missing horizonos.permission.HEADSET_CAMERA (comes from the Meta AR camera feature)"
            expect "name='com\.oculus\.permission\.USE_SCENE'" "Missing com.oculus.permission.USE_SCENE (comes from com.unity.xr.meta-openxr)"
            reject "com\.pvr\.tobactivate\.permission\.AUTH_CHECK" "PICO permission com.pvr.tobactivate.permission.AUTH_CHECK is in the Quest APK"
          fi

          {
            echo "### Quest APK"
            echo
            echo "- File: \`${APK}\` ($(du -h "$APK" | cut -f 1))"
            echo "- SHA-256: \`$(sha256sum "$APK" | cut -d ' ' -f 1)\`"
            echo "- Unity: \`${UNITY_VERSION}\`"
            if [[ -n "$manifest" ]]; then
              echo
              echo '```'
              grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|native-code|uses-permission):" <<< "$manifest" | sort -u || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#errors[@]} > 0 )); then
            for error in "${errors[@]}"; do echo "::error title=Quest APK check failed::${error}"; done
            exit 1
          fi
          echo "Quest APK checks passed."

      - name: Upload the APK
        # Uploaded even when a check above failed, so the APK can be inspected.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not zipped: the artifact downloads as CISpatialCompanion-Quest.apk itself
          # (with archive off, the artifact takes the file's name).
          path: ${{ env.APK }}
          archive: false
          if-no-files-found: warn
          retention-days: 14
