# Builds the Meta Quest 3 APK through the project's own build entry point
# (XRScan.EditorTools.XRScanBuilder.BuildQuest, the same code as the
# XRScan > Build > Quest 3 menu) in the Unity editor version named in
# ProjectSettings/ProjectVersion.txt, then checks what was packaged.
# Called by ci.yml after the tests pass; can also be started by hand from the
# Actions tab. See docs/CI.md.
#
# No workflow-level concurrency here on purpose: when called, this workflow would
# share the caller's concurrency group and block itself. ci.yml sets it instead.
name: Quest APK

on:
  workflow_call:
    secrets:
      UNITY_EMAIL:
        description: E-mail address of the Unity ID that holds the licence (Personal or a paid seat).
        required: false
      UNITY_PASSWORD:
        description: Password of that Unity ID.
        required: false
      UNITY_SERIAL:
        description: Serial key of a paid seat (Pro, Enterprise, Industry). Leave unset for Unity Personal.
        required: false
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      unity-version: ${{ steps.unity.outputs.version }}
      licence-ok: ${{ steps.licence.outputs.available }}
      version: ${{ steps.version.outputs.version }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Unity version from ProjectSettings/ProjectVersion.txt
        id: unity
        run: |
          version="$(sed -n 's/^m_EditorVersion:[[:space:]]*//p' ProjectSettings/ProjectVersion.txt | tr -d '\r' | head -n 1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]; then
            echo "::error file=ProjectSettings/ProjectVersion.txt::Could not read m_EditorVersion (got '${version}')."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Unity editor \`${version}\` (from ProjectSettings/ProjectVersion.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read the app version from Player Settings
        # Player Settings > Version (bundleVersion) is the one place the version is set: XRScanBuilder uses it as
        # the versionName and derives the versionCode from it, MAJOR*1000000 + MINOR*1000 + PATCH.
        id: version
        run: |
          settings=ProjectSettings/ProjectSettings.asset
          version="$(sed -n 's/^[[:space:]]*bundleVersion:[[:space:]]*//p' "$settings" | tr -d '\r' | head -n 1)"
          if [[ ! "$version" =~ ^([0-9]{1,4})\.([0-9]{1,3})\.([0-9]{1,3})([-+][0-9A-Za-z.+-]*)?$ ]]; then
            echo "::error file=${settings}::bundleVersion '${version}' is not MAJOR.MINOR.PATCH with MINOR and PATCH below 1000."
            exit 1
          fi
          code=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          if (( code < 1 || code > 2100000000 )); then
            echo "::error file=${settings}::bundleVersion '${version}' gives versionCode ${code}, outside 1 to 2100000000."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "App version \`${version}\`, versionCode \`${code}\` (from Player Settings > Version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Unity licence secrets
        id: licence
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Fork and Dependabot pull requests never receive repository secrets.
          NO_SECRETS_EXPECTED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
        # Unity Personal activates from the Unity ID alone; a paid seat also needs UNITY_SERIAL, which the
        # activation step reports if it is wrong. UNITY_LICENSE (a .ulf file) is not used: see docs/CI.md.
        run: |
          missing=()
          [[ -n "$UNITY_EMAIL" ]] || missing+=("UNITY_EMAIL")
          [[ -n "$UNITY_PASSWORD" ]] || missing+=("UNITY_PASSWORD")
          if (( ${#missing[@]} == 0 )); then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$NO_SECRETS_EXPECTED" == "true" ]]; then
            echo "::notice title=Unity jobs skipped::Secrets are not passed to fork or Dependabot pull requests, so the Unity jobs are skipped. A maintainer can run the workflow from a branch of this repository."
            exit 0
          fi
          list="$(printf '%s; ' "${missing[@]}")"
          echo "::error title=Unity licence secrets missing::Add these repository secrets: ${list%; }. See docs/CI.md."
          exit 1

  build:
    name: Build Quest APK
    needs: setup
    if: needs.setup.outputs.licence-ok == 'true'
    runs-on: ubuntu-24.04
    # A cold run (no Library cache) imports the whole project, then compiles IL2CPP.
    timeout-minutes: 150
    env:
      UNITY_VERSION: ${{ needs.setup.outputs.unity-version }}
      VERSION_NAME: ${{ needs.setup.outputs.version }}
      VERSION_CODE: ${{ needs.setup.outputs.version-code }}
      # XRScanBuilder's default output path (Builds/ is git-ignored).
      APK: Builds/CISpatialCompanion-Quest.apk
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Unity editor image
        # The Android editor image is over 8 GB compressed; drop preinstalled SDKs this job never uses
        # (the image brings its own Android SDK, NDK and JDK).
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Restore the Library cache
        id: library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ runner.os }}-android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-android-${{ env.UNITY_VERSION }}-

      - name: Remove stale helper process IDs from the restored Library
        # Unity records the process IDs of its helpers in Library and kills those IDs when it next starts. In a
        # new container such an ID can belong to the editor itself, which then dies with exit code 137. game-ci/cli
        # removes these files itself from v0.1.74 on; the pinned v0.1.72 does not.
        run: rm -f Library/ilpp.pid Library/MSBuild/buildhost.pid

      - name: Build with XRScanBuilder.BuildQuest
        id: build
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          # The action runs this release of game-ci/cli, which does the activation and the build
          # (docs/CI.md, "Pinned actions").
          cliVersion: v0.1.72
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: XRScan.EditorTools.XRScanBuilder.BuildQuest
          # XRScanBuilder sets its own player settings, output path and version (from Player Settings >
          # Version); skip game-ci's git-based versioning (it would need full history and a clean tree).
          versioning: None
          # Run the editor without -quit. The builder takes MCP for Unity out of the project before
          # the Quest build (the PICO SDK is not in it), which needs a script reload that -quit would
          # cut short (the builder refuses to start when it sees -quit). It exits by itself once the
          # build has ended and the project files are restored: 0 = built, 1 = failed.
          manualExit: true

      - name: Save the Library cache
        if: steps.build.outcome == 'success' && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      - name: Verify the APK
        # XRScanBuilder already exits non-zero (failing the build step) when the build fails or writes no APK.
        # The script checks what was packaged, the manifest and the signature (docs/CI.md, "Quest APK checks").
        run: bash tools/apk/check_quest_package.sh "$APK" debug

      - name: Upload the APK
        # Uploaded even when a check above failed, so the APK can be inspected.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not zipped: the artifact downloads as CISpatialCompanion-Quest.apk itself
          # (with archive off, the artifact takes the file's name).
          path: ${{ env.APK }}
          archive: false
          if-no-files-found: warn
          retention-days: 14
